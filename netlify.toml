# Netlify — Relief Hotels (production hosting, ADR-004)
# Guide: docs/deploy/NETLIFY.md

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Set NEXT_PUBLIC_APP_URL in Netlify UI (Site configuration → Environment variables)

[context.deploy-preview.environment]
  NOTIFY_CHANNEL = "console"
