# Netlify — Relief Hotels (production hosting, ADR-004)
# Guide: docs/deploy/NETLIFY.md

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Set NEXT_PUBLIC_APP_URL in Netlify UI (Site configuration → Environment variables)

[context.deploy-preview.environment]
  NOTIFY_CHANNEL = "console"

# Canonical guest host: apex → www (Primary domain must be www — see NETLIFY.md).
# If Cloudflare ALSO redirects www → apex, you get ERR_TOO_MANY_REDIRECTS; fix CF.
[[redirects]]
  from = "https://reliefhotelsandsuites.com/*"
  to = "https://www.reliefhotelsandsuites.com/:splat"
  status = 301
  force = true
