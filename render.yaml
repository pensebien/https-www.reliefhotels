# Render Blueprint — Relief Hotels (optional: connect via Render Dashboard)
# Docs: docs/deploy/RENDER.md

services:
  - type: web
    name: reliefhotels
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /en
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: NOTIFY_CHANNEL
        value: both
      - key: DEMO_DASHBOARD_KEY
        sync: false
